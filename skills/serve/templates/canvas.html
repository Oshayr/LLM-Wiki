{% extends "base.html" %}

{% block title %}Canvas — LLM Wiki{% endblock %}

{% block content %}
<div id="canvas-container" style="width: 100%; height: calc(100vh - 60px); position: relative;">
    <div id="canvas-toolbar" style="position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; gap: 8px; background: var(--bg-primary, white); padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
        <button onclick="autoLayout()" style="padding: 6px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; cursor: pointer; background: white;">Auto Layout</button>
        <button onclick="saveCanvas()" style="padding: 6px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; cursor: pointer; background: white;">Save Layout</button>
        <button onclick="resetView()" style="padding: 6px 12px; border: 1px solid var(--border, #ddd); border-radius: 4px; cursor: pointer; background: white;">Reset View</button>
        <select id="layout-select" onchange="changeLayout(this.value)" style="padding: 6px; border: 1px solid var(--border, #ddd); border-radius: 4px;">
            <option value="cose">Force (cose)</option>
            <option value="grid">Grid</option>
            <option value="circle">Circle</option>
            <option value="concentric">Concentric</option>
            <option value="breadthfirst">Hierarchy</option>
        </select>
    </div>
    <div id="cy" style="width: 100%; height: 100%;"></div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cytoscape-panzoom@2.5.3/cytoscape.js-panzoom.css">
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.4/dist/cytoscape.min.js"></script>

<script>
const nodes = {{ nodes_json }};
const edges = {{ edges_json }};
const savedLayout = {{ canvas_data_json }};

const typeColors = {
    'concept': '#3b82f6', 'entity': '#22c55e', 'source': '#9ca3af',
    'analysis': '#8b5cf6', 'comparison': '#f59e0b', 'research-scan': '#06b6d4',
    'deep-dive': '#ec4899', 'documentation': '#64748b', 'daily-note': '#a3a3a3',
    'unknown': '#d4d4d4'
};

const confColors = { 'high': '#22c55e', 'medium': '#f59e0b', 'low': '#ef4444' };

// Build cytoscape elements
const cyNodes = nodes.map(n => ({
    data: {
        id: n.id, label: n.title, type: n.type, confidence: n.confidence,
        color: typeColors[n.type] || typeColors['unknown'],
        borderColor: confColors[n.confidence] || '#d4d4d4',
    },
    position: savedLayout.positions ? savedLayout.positions[n.id] : undefined,
}));

const cyEdges = edges.map((e, i) => ({
    data: { id: 'e' + i, source: e.source, target: e.target, type: e.type }
}));

const cy = cytoscape({
    container: document.getElementById('cy'),
    elements: { nodes: cyNodes, edges: cyEdges },
    style: [
        {
            selector: 'node',
            style: {
                'label': 'data(label)',
                'background-color': 'data(color)',
                'border-width': 3,
                'border-color': 'data(borderColor)',
                'font-size': '11px',
                'text-wrap': 'wrap',
                'text-max-width': '120px',
                'width': 40, 'height': 40,
                'text-valign': 'bottom',
                'text-margin-y': 5,
                'color': 'var(--text-primary, #333)',
            }
        },
        {
            selector: 'edge',
            style: {
                'width': 1.5,
                'line-color': '#ccc',
                'target-arrow-color': '#ccc',
                'target-arrow-shape': 'triangle',
                'curve-style': 'bezier',
                'arrow-scale': 0.8,
            }
        },
        {
            selector: 'node:selected',
            style: { 'border-width': 4, 'border-color': '#2563eb', 'background-color': '#dbeafe' }
        },
    ],
    layout: savedLayout.positions ? { name: 'preset' } : { name: 'cose', animate: true, randomize: true },
    wheelSensitivity: 0.3,
});

// Click to navigate
cy.on('tap', 'node', function(evt) {
    const slug = evt.target.id();
    window.location.href = '/wiki/' + slug;
});

// Hover for tooltip
cy.on('mouseover', 'node', function(evt) {
    evt.target.style('font-size', '14px');
    document.body.style.cursor = 'pointer';
});
cy.on('mouseout', 'node', function(evt) {
    evt.target.style('font-size', '11px');
    document.body.style.cursor = 'default';
});

function changeLayout(name) {
    cy.layout({ name: name, animate: true, animationDuration: 500, randomize: name === 'cose' }).run();
}

function autoLayout() {
    cy.layout({ name: 'cose', animate: true, animationDuration: 800, randomize: true }).run();
}

function resetView() {
    cy.fit(undefined, 30);
}

function saveCanvas() {
    const positions = {};
    cy.nodes().forEach(n => { positions[n.id()] = n.position(); });
    fetch('/api/canvas/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ positions: positions })
    }).then(() => {
        const btn = document.querySelector('[onclick="saveCanvas()"]');
        const orig = btn.textContent;
        btn.textContent = 'Saved!';
        setTimeout(() => btn.textContent = orig, 1500);
    });
}
</script>
{% endblock %}
