{% extends "base.html" %}
{% block title %}Error - LLM Wiki{% endblock %}
{% block content %}
<div class="error-page" role="alert">
    <h1>Page Not Found</h1>
    <p>{{ message }}</p>
    <p style="margin-top: 1.5em;">
        <a href="/" class="wiki-btn wiki-btn-primary">Return to Home</a>
        <a href="/search" class="wiki-btn wiki-btn-secondary" style="margin-left: 8px;">Search the Wiki</a>
    </p>
</div>
{% endblock %}
