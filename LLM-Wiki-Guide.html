<style>
:root {
  --bg: #fafaf9; --bg-alt: #f5f5f4; --bg-card: #ffffff; --border: #e7e5e4;
  --text: #1c1917; --text-muted: #78716c; --text-light: #a8a29e;
  --accent: #0f766e; --accent-light: #ccfbf1; --accent-hover: #115e59;
  --code-bg: #1e293b; --code-text: #e2e8f0;
  --warn: #d97706; --warn-bg: #fffbeb; --warn-border: #fde68a;
  --info: #0284c7; --info-bg: #f0f9ff; --info-border: #bae6fd;
  --success: #16a34a; --success-bg: #f0fdf4; --success-border: #bbf7d0;
  --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fecaca;
  --sidebar-w: 280px; --header-h: 56px;
  --radius: 6px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}

* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--text); background:var(--bg); line-height:1.65; font-size:15px; }
h1,h2,h3,h4 { font-family:'Fraunces',Georgia,serif; font-weight:700; line-height:1.25; }

.header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--bg-card);
  border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; z-index:100; backdrop-filter:blur(12px); }
.header-logo { font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--accent); }
.header-logo span { color:var(--text-muted); font-weight:400; font-size:14px; margin-left:8px; }
.header-badge { margin-left:12px; font-size:11px; font-weight:600; background:var(--accent-light); color:var(--accent); padding:2px 8px; border-radius:99px; }
.header-right { margin-left:auto; display:flex; gap:12px; align-items:center; }
.header-right a { font-size:13px; color:var(--text-muted); text-decoration:none; }
.header-right a:hover { color:var(--accent); }
.version-tag { font-size:11px; background:var(--bg-alt); border:1px solid var(--border); padding:2px 8px; border-radius:4px; color:var(--text-muted); }

.print-only { display:none; }
@media print {
  .sidebar, .header { display:none; }
  .main { margin-left:0; margin-top:0; padding:20px; max-width:none; }
  .print-only { display:block; }
  body { font-size:12pt; line-height:1.5; }
  .card { break-inside:avoid; box-shadow:none; border:1px solid #ddd; }
  .code-block { background:#f5f5f5; color:#333; break-inside:avoid; }
}

.sidebar { position:fixed; top:var(--header-h); left:0; bottom:0; width:var(--sidebar-w);
  background:var(--bg-card); border-right:1px solid var(--border); overflow-y:auto; padding:16px 0; z-index:90; transition:transform .2s; }
.sidebar::-webkit-scrollbar { width:4px; } .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.nav-section { padding:0 16px; margin-bottom:4px; }
.nav-section-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text-light); padding:12px 0 4px; }
.nav-item { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:var(--radius);
  font-size:13.5px; color:var(--text-muted); cursor:pointer; transition:all .12s; text-decoration:none; }
.nav-item:hover { background:var(--bg-alt); color:var(--text); }
.nav-item.active { background:var(--accent-light); color:var(--accent); font-weight:500; }
.nav-icon { width:16px; height:16px; flex-shrink:0; opacity:.6; }
.nav-item.active .nav-icon { opacity:1; }

.main { margin-left:var(--sidebar-w); margin-top:var(--header-h); padding:32px 48px 80px; max-width:960px; }
.main section { margin-bottom:56px; }
.section-title { font-size:28px; color:var(--text); margin-bottom:6px; }
.section-subtitle { font-size:15px; color:var(--text-muted); margin-bottom:24px; }

.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:16px; box-shadow:var(--shadow); }
.card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.card-title { font-family:'Fraunces',serif; font-size:17px; font-weight:700; }
.card-desc { font-size:14px; color:var(--text-muted); line-height:1.6; }

.code-block { background:var(--code-bg); color:var(--code-text); border-radius:var(--radius); padding:16px 20px; margin:12px 0; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.7; overflow-x:auto; position:relative; }
.code-block .code-label { position:absolute; top:8px; right:12px; font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.05em; }
code { font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--bg-alt); padding:1px 5px; border-radius:3px; color:var(--accent); }

.callout { border-radius:var(--radius); padding:14px 18px; margin:14px 0; font-size:14px; display:flex; gap:10px; }
.callout-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.callout.info { background:var(--info-bg); border:1px solid var(--info-border); color:#0c4a6e; }
.callout.warn { background:var(--warn-bg); border:1px solid var(--warn-border); color:#92400e; }
.callout.success { background:var(--success-bg); border:1px solid var(--success-border); color:#14532d; }
.callout.danger { background:var(--danger-bg); border:1px solid var(--danger-border); color:#7f1d1d; }

.table-wrap { overflow-x:auto; margin:12px 0; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; font-weight:600; padding:10px 14px; background:var(--bg-alt); border-bottom:2px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
td { padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:hover td { background:var(--bg-alt); }

.badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; letter-spacing:.02em; }
.badge.green { background:#dcfce7; color:#166534; } .badge.blue { background:#dbeafe; color:#1e40af; }
.badge.amber { background:#fef3c7; color:#92400e; } .badge.red { background:#fee2e2; color:#991b1b; }
.badge.gray { background:#f3f4f6; color:#4b5563; } .badge.teal { background:var(--accent-light); color:var(--accent); }

.step { display:flex; gap:16px; margin-bottom:20px; }
.step-num { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; margin-top:2px; }
.step-body { flex:1; } .step-title { font-weight:600; font-size:15px; margin-bottom:4px; }
.step-desc { font-size:14px; color:var(--text-muted); }

.diagram { background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin:16px 0; overflow-x:auto; }
.diagram svg { display:block; margin:0 auto; }

.tabs { display:flex; gap:2px; border-bottom:2px solid var(--border); margin-bottom:16px; }
.tab { padding:8px 16px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .12s; }
.tab:hover { color:var(--text); } .tab.active { color:var(--accent); border-bottom-color:var(--accent); }

.expand-header { display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px 0; user-select:none; }
.expand-header:hover { color:var(--accent); }
.expand-arrow { transition:transform .2s; font-size:12px; } .expand-arrow.open { transform:rotate(90deg); }

.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }

.flow-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
.flow-box { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; font-size:13px; font-weight:500; white-space:nowrap; }
.flow-arrow { color:var(--text-light); font-size:18px; }

.search-box { display:flex; align-items:center; gap:8px; background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; margin-bottom:20px; }
.search-box input { flex:1; border:none; background:none; outline:none; font-size:14px; font-family:inherit; color:var(--text); }
.search-box input::placeholder { color:var(--text-light); }

.dep-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:8px; }
.dep-card .dep-name { font-weight:600; font-size:14px; } .dep-card .dep-type { font-size:11px; font-weight:600; }

.mobile-toggle { display:none; background:none; border:none; cursor:pointer; padding:8px; }

@keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.5; } }
@keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
@keyframes flowAnim { 0% { strokeDashoffset:100%; } 100% { strokeDashoffset:0%; } }
@keyframes glowPulse { 0%, 100% { filter:drop-shadow(0 0 3px currentColor); } 50% { filter:drop-shadow(0 0 8px currentColor); } }
@keyframes progressBar { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }
@keyframes nodeFloat { 0%, 100% { transform:translateY(0px); } 50% { transform:translateY(-3px); } }

.arch-layer { transition:all 0.2s ease; cursor:pointer; }
.arch-layer:hover { filter:drop-shadow(0 0 8px rgba(15, 118, 110, 0.4)); }

.network-node { transition:all 0.2s ease; }
.network-node:hover { filter:drop-shadow(0 0 6px rgba(0,0,0,0.2)); }

.pipeline-step { animation: slideIn 0.3s ease-out; }
.pipeline-step.active { filter:drop-shadow(0 0 6px rgba(15, 118, 110, 0.5)); }

.freshness-tier { transition:all 0.2s ease; cursor:pointer; position:relative; }
.freshness-tier:hover { transform:translateY(-2px); filter:drop-shadow(0 0 4px rgba(0,0,0,0.15)); }
.freshness-tooltip { position:absolute; bottom:100%; left:50%; transform:translateX(-50%); background:var(--text); color:white; padding:8px 12px; border-radius:4px; font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity 0.2s; margin-bottom:8px; }
.freshness-tier:hover .freshness-tooltip { opacity:1; }

.circuit-state { transition:all 0.3s ease; }
.circuit-state.pulse { animation:pulse 1s infinite; }

.stats-counter { font-family:'IBM Plex Mono', monospace; font-weight:600; }

@media(max-width:860px) {
  .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; padding:24px 20px 80px; }
  .mobile-toggle { display:block; } .grid-2,.grid-3 { grid-template-columns:1fr; }
}
</style>
</head>

function Expandable({title, children, defaultOpen=false}) {
  const [open, setOpen] = useState(defaultOpen);
  return <div style={{borderBottom:'1px solid var(--border)', marginBottom:4}}>
    <div className="expand-header" onClick={()=>setOpen(!open)}>
      <span className={`expand-arrow ${open?'open':''}`}>{'\u25B6'}</span>
      <span style={{fontWeight:600,fontSize:14}}>{title}</span>
    </div>
    {open && <div style={{paddingBottom:12,paddingLeft:4}}>{children}</div>}
  </div>;
}

function CodeBlock({children, label}) {
  return <div className="code-block">{label && <span className="code-label">{label}</span>}<pre style={{margin:0,whiteSpace:'pre-wrap'}}>{children}</pre></div>;
}

  const icons = {info:"ℹ️", warn:"⚠️", success:"✅", danger:"🚫"};
  return <div className={`callout ${type}`}><span className="callout-icon">{icons[type]}</span><div>{children}</div></div>;
}

// Agent Network Graph with animated connections
function AgentNetworkGraph() {
  const [hoveredAgent, setHoveredAgent] = useState(null);

  const agents = [
    {name:"wiki-writer", x:150, y:80, color:"#0f766e"},
    {name:"wiki-reader", x:350, y:80, color:"#0284c7"},
    {name:"search-orch.", x:550, y:80, color:"#7c3aed"},
    {name:"research-loop", x:100, y:200, color:"#9333ea"},
    {name:"search-channel", x:350, y:200, color:"#6366f1"},
    {name:"research-proc.", x:600, y:200, color:"#a855f7"},
    {name:"fact-checker", x:200, y:320, color:"#dc2626"},
    {name:"citation-expl.", x:500, y:320, color:"#0891b2"},
  ];

  const connections = [
    ["research-loop", "search-orch."],
    ["search-orch.", "search-channel"],
    ["search-channel", "research-proc."],
    ["research-proc.", "wiki-writer"],
    ["wiki-writer", "wiki-reader"],
    ["search-orch.", "fact-checker"],
    ["research-proc.", "citation-expl."],
  ];

  const getAgent = name => agents.find(a => a.name === name);

  return <div className="diagram">
    <svg width="700" height="420" viewBox="0 0 700 420" style={{fontFamily:'IBM Plex Sans,sans-serif'}}>
      <text x="350" y="24" textAnchor="middle" fontSize="14" fontWeight="700" fill="#1c1917">Agent Communication Network</text>

      {connections.map((conn, i) => {
        const from = getAgent(conn[0]);
        const to = getAgent(conn[1]);
        const highlighted = hoveredAgent && (hoveredAgent === conn[0] || hoveredAgent === conn[1]);
        return (
          <line key={`line-${i}`} x1={from.x} y1={from.y} x2={to.x} y2={to.y}
                stroke={highlighted ? from.color : '#d1d5db'} strokeWidth={highlighted ? 2.5 : 1.5}
                strokeDasharray="5,5" style={{transition:'all 0.2s', opacity: highlighted ? 1 : 0.5}}
                markerEnd={highlighted ? `url(#arrow-${i})` : undefined}/>
        );
      })}

      {agents.map((agent, i) => (
        <g key={agent.name} className="network-node"
           onMouseEnter={() => setHoveredAgent(agent.name)}
           onMouseLeave={() => setHoveredAgent(null)}>
          <circle cx={agent.x} cy={agent.y} r={hoveredAgent === agent.name ? 28 : 22}
                  fill={agent.color} opacity={hoveredAgent === agent.name ? 1 : 0.85}
                  style={{filter: hoveredAgent === agent.name ? 'drop-shadow(0 0 8px rgba(0,0,0,0.2))' : 'none', transition:'all 0.2s'}}/>
          <text x={agent.x} y={agent.y} textAnchor="middle" dominantBaseline="middle"
                fontSize="10" fontWeight="600" fill="#fff">{agent.name}</text>
        </g>
      ))}

      {connections.map((conn, i) => (
        <defs key={`marker-${i}`}>
          <marker id={`arrow-${i}`} viewBox="0 0 10 10" refX="10" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill={getAgent(conn[0]).color}/>
          </marker>
        </defs>
      ))}
    </svg>
    <div style={{fontSize:'13px', color:'var(--text-muted)', marginTop:'12px'}}>
      <strong>Legend:</strong> Hover over an agent to highlight its connections. Teal=CRUD, Purple=Research, Red/Blue=Quality
    </div>
  </div>;
}

// Research Pipeline Animated Flowchart
function ResearchPipeline() {
  const [activeStep, setActiveStep] = useState(0);

  useEffect(() => {
    const interval = setInterval(() => {
      setActiveStep(s => (s + 1) % 10);
    }, 900);
    return () => clearInterval(interval);
  }, []);

  // Layout: row 1 is linear, row 2 is the fan-out, row 3 continues after merge
  // Row 1: Question -> Wiki Check -> Cache Check -> Search Orch.
  // Row 2 (fan-out):                                   |-> Web
  //                                                     |-> Docs
  // Row 3:                                Merge <- -----+
  // Row 3 continued: Merge -> Dedup -> Fact Check -> Ingest

  const boxW = 82, boxH = 36, gap = 14;
  const row1Y = 50, row2Y = 120, row3Y = 190;

  const nodes = [
    {label:"Question",     time:"",     x:30,  y:row1Y, step:0},
    {label:"Wiki Check",   time:"~0.5s",x:30+1*(boxW+gap), y:row1Y, step:1},
    {label:"Cache Check",  time:"~0.2s",x:30+2*(boxW+gap), y:row1Y, step:2},
    {label:"Search Orch.", time:"~1s",  x:30+3*(boxW+gap), y:row1Y, step:3},
    // fan-out
    {label:"Web Search",   time:"~2s",  x:30+2*(boxW+gap), y:row2Y, step:4},
    {label:"Doc Search",   time:"~2s",  x:30+4*(boxW+gap), y:row2Y, step:4},
    // merge row
    {label:"Merge",        time:"~0.5s",x:30+3*(boxW+gap), y:row3Y, step:5},
    {label:"Dedup",        time:"~0.3s",x:30+4*(boxW+gap), y:row3Y, step:6},
    {label:"Fact Check",   time:"~3s",  x:30+5*(boxW+gap), y:row3Y, step:7},
    {label:"Wiki Ingest",  time:"",     x:30+6*(boxW+gap), y:row3Y, step:8},
  ];

  // Arrows: [fromIdx, toIdx]
  const arrows = [
    [0,1],[1,2],[2,3],  // row 1 linear
    [3,4],[3,5],        // fan-out down
    [4,6],[5,6],        // converge to merge
    [6,7],[7,8],[8,9],  // row 3 linear
  ];

  function boxCenter(n) { return {cx: n.x + boxW/2, cy: n.y + boxH/2}; }

  return <div className="diagram" style={{overflowX:'auto'}}>
    <svg width="720" height="260" viewBox="0 0 720 260" style={{fontFamily:'IBM Plex Sans,sans-serif'}}>
      <text x="360" y="24" textAnchor="middle" fontSize="14" fontWeight="700" fill="#1c1917">Research Engine Pipeline</text>

      <defs>
        <marker id="arrowSmall" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
        </marker>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/>
        </marker>
      </defs>

      {arrows.map(([fi,ti], idx) => {
        const f = nodes[fi], t = nodes[ti];
        const fc = boxCenter(f), tc = boxCenter(t);
        const lit = activeStep >= f.step && activeStep >= t.step;
        // straight or vertical connection?
        const sameRow = f.y === t.y;
        if (sameRow) {
          const x1 = f.x + boxW, y1 = fc.cy, x2 = t.x, y2 = tc.cy;
          return <line key={idx} x1={x1} y1={y1} x2={x2} y2={y2}
            stroke={lit ? '#0f766e' : '#d1d5db'} strokeWidth={lit ? 2 : 1.5}
            markerEnd={lit ? 'url(#arrowSmall)' : 'url(#arrowGray)'}
            style={{transition:'all 0.3s'}}/>;
        }
        // vertical / diagonal
        return <path key={idx}
          d={`M ${fc.cx} ${f.y + boxH} L ${tc.cx} ${t.y}`}
          stroke={lit ? '#0f766e' : '#d1d5db'} strokeWidth={lit ? 2 : 1.5} fill="none"
          markerEnd={lit ? 'url(#arrowSmall)' : 'url(#arrowGray)'}
          style={{transition:'all 0.3s'}}/>;
      })}

      {nodes.map((n, i) => {
        const lit = activeStep >= n.step;
        return <g key={i}>
          <rect x={n.x} y={n.y} width={boxW} height={boxH} rx="6"

// Circuit Breaker State Machine
function CircuitBreaker() {
  const [state, setState] = useState("closed");

  const states = [
    {name:"Closed", color:"#22c55e", desc:"Normal operation"},
    {name:"Open", color:"#ef4444", desc:"Failures exceeded"},
    {name:"Half-Open", color:"#eab308", desc:"Testing recovery"},
  ];

  const transitions = [
    {from:"Closed", to:"Open", label:"5 failures"},
    {from:"Open", to:"Half-Open", label:"300s timeout"},
    {from:"Half-Open", to:"Closed", label:"3 successes"},
    {from:"Half-Open", to:"Open", label:"1 failure"},
  ];

  return <div className="diagram">
    <svg width="700" height="350" viewBox="0 0 700 350" style={{fontFamily:'IBM Plex Sans,sans-serif'}}>
      <text x="350" y="24" textAnchor="middle" fontSize="14" fontWeight="700" fill="#1c1917">Circuit Breaker State Machine</text>

      {states.map((s, i) => {
        const x = 100 + (i * 250);
        const y = 150;
        const isActive = state === s.name.toLowerCase();

        return (
          <g key={s.name} onClick={() => {
            const nextState = state === "closed" ? "open" : state === "open" ? "half-open" : "closed";
            setState(nextState);
          }} style={{cursor:'pointer'}}>
            <circle cx={x} cy={y} r={isActive ? 50 : 40}
                    fill={s.color} opacity={isActive ? 1 : 0.6}
                    className={isActive ? "circuit-state pulse" : "circuit-state"}
                    style={{transition:'all 0.3s'}}/>
            <text x={x} y={y - 8} textAnchor="middle" dominantBaseline="middle"
                  fontSize="13" fontWeight="700" fill="#fff">{s.name}</text>
            <text x={x} y={y + 15} textAnchor="middle" dominantBaseline="middle"
                  fontSize="11" fill="#fff">{s.desc}</text>
          </g>
        );
      })}

      {transitions.map((t, i) => {
        const fromIdx = states.findIndex(s => s.name === t.from);
        const toIdx = states.findIndex(s => s.name === t.to);
        const fromX = 100 + (fromIdx * 250);
        const toX = 100 + (toIdx * 250);
        const y = 150;
        const offsetY = 20 + (i * 15);

        return (
          <g key={`${t.from}-${t.to}`}>
            <path d={`M ${fromX + 40} ${y - 20} Q ${(fromX + toX)/2} ${y - offsetY} ${toX - 40} ${y - 20}`}
                  stroke="#a8a29e" strokeWidth="2" fill="none" markerEnd="url(#arrowTrans)"/>
            <text x={(fromX + toX)/2} y={y - offsetY - 8} textAnchor="middle"
                  fontSize="10" fill="#1c1917" fontWeight="500">{t.label}</text>
          </g>
        );
      })}

      <defs><marker id="arrowTrans" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/></marker></defs>
    </svg>
    <p style={{fontSize:'13px', color:'var(--text-muted)', marginTop:'12px', textAlign:'center'}}>Click any state to cycle through transitions</p>
  </div>;
}

              <li><strong>Tools:</strong> query engine, export, flashcards, diffs</li>
            </ul>
          </Expandable>
          <Expandable title="Servers">
            <p style={{fontSize:'13px', marginBottom:8}}>MCP server (always running) and FastAPI server (on-demand):</p>
            <ul style={{fontSize:'13px', marginLeft:16, marginBottom:8}}>
              <li><strong>MCP:</strong> wiki_search, wiki_read, wiki_write, wiki_list, wiki_backlinks, wiki_stats, wiki_query, wiki_gaps, wiki_daily</li>
              <li><strong>FastAPI:</strong> /api/search, /api/pages, /api/graph, WebSocket /ws</li>
            </ul>
          </Expandable>
        </div>
      </section>

      {/* DATA MODEL */}
      <section id="data-model">
        <h1 className="section-title">Data Model</h1>
        <p className="section-subtitle">Structure of wiki pages, frontmatter, and metadata.</p>
        <FreshnessTiers/>
        <h3 style={{marginTop:24,marginBottom:16}}>Page Structure</h3>
        <div className="card">
          <strong>All wiki pages follow this format:</strong>
          <CodeBlock label="yaml+markdown">{`---
slug: transformers-attention
title: Attention Mechanisms in Transformers
type: concept
confidence: high
tags: [ml, deep-learning, nlp]
sources:
  - title: "Attention is All You Need"
    url: https://arxiv.org/abs/1706.03762
    date: 2017-06-12
  - title: "Wikipedia: Attention"
    url: https://en.wikipedia.org/wiki/Attention_mechanism
related: [rlhf, scaling-laws, transformers]
created_at: 2026-02-15T10:30:00Z
updated_at: 2026-04-05T14:22:00Z
freshness_tier: warm
---

# Attention Mechanisms in Transformers

[[transformers]] rely on attention to weigh the importance of different input elements.

## Multi-Head Attention

...`}</CodeBlock>
        </div>
        <WikiLinkVisualizer/>
        <h3 style={{marginTop:24,marginBottom:16}}>Page Types (10 Total)</h3>
        <div className="table-wrap"><table><thead><tr><th>Type</th><th>Purpose</th><th>Example</th></tr></thead><tbody>
          <tr><td><Badge color="teal">concept</Badge></td><td>Definitions, principles, academic topics</td><td>Transformers, RLHF, Backpropagation</td></tr>
          <tr><td><Badge color="blue">idea</Badge></td><td>New thoughts, hypotheses, brainstorms</td><td>Better search ranking, Novel loss function</td></tr>
          <tr><td><Badge color="amber">brainstorming</Badge></td><td>Unstructured exploration, open questions</td><td>Future research directions, What-ifs</td></tr>
          <tr><td><Badge color="green">status</Badge></td><td>Project status, progress tracking</td><td>LLM-Wiki v1.0 release, Experiment results</td></tr>
          <tr><td><Badge color="red">rules</Badge></td><td>Operating principles, standards</td><td>Citation requirements, Code style guide</td></tr>
          <tr><td><Badge color="gray">config</Badge></td><td>Settings, configuration docs</td><td>Fresh ness tier defaults, Search parameters</td></tr>
          <tr><td><Badge color="teal">skill</Badge></td><td>Claude Code skills (slash commands)</td><td>/wiki-read, /wiki-write reference</td></tr>
          <tr><td><Badge color="blue">memory</Badge></td><td>Personal context, background info</td><td>My research interests, Team conventions</td></tr>
          <tr><td><Badge color="amber">reference</Badge></td><td>External resources, citations</td><td>Research papers, Documentation links</td></tr>
          <tr><td><Badge color="green">custom</Badge></td><td>User-defined types via templates</td><td>Meeting notes, Case studies</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:16}}>Confidence Levels</h3>
        <div className="grid-3">
          <div className="card">
            <div style={{fontSize:'12px', fontWeight:'600', color:'#dc2626', marginBottom:'8px'}}>LOW</div>
            <p style={{fontSize:'13px', marginBottom:'8px'}}>Single source or unverified claim</p>
            <div style={{fontSize:'12px', color:'var(--text-muted)'}}>Promotion: +1 source</div>
          </div>
          <div className="card">
            <div style={{fontSize:'12px', fontWeight:'600', color:'#eab308', marginBottom:'8px'}}>MEDIUM</div>
            <p style={{fontSize:'13px', marginBottom:'8px'}}>2+ sources, basic verification</p>
            <div style={{fontSize:'12px', color:'var(--text-muted)'}}>Promotion: 3+ corroborating</div>
          </div>
          <div className="card">
            <div style={{fontSize:'12px', fontWeight:'600', color:'#22c55e', marginBottom:'8px'}}>HIGH</div>
            <p style={{fontSize:'13px', marginBottom:'8px'}}>3+ independent sources, fact-checked</p>
            <div style={{fontSize:'12px', color:'var(--text-muted)'}}>Status: Stable, trusted</div>
          </div>
        </div>
      </section>

      {/* AGENTS */}
      <section id="agents">
        <h1 className="section-title">Agents</h1>
        <p className="section-subtitle">Autonomous agents that power the system. Each agent handles a specific domain of work.</p>
        <AgentNetworkGraph/>
        <h3 style={{marginTop:24,marginBottom:16}}>Agent Catalog</h3>
        {AGENTS.map((agent, i) => (
          <Expandable key={i} title={<span style={{color:agent.color,fontWeight:'700'}}>{agent.name}</span>} defaultOpen={i===0}>
            <div style={{paddingLeft:'4px',fontSize:'13px',lineHeight:'1.6'}}>
              <div style={{marginBottom:'8px'}}><strong>Purpose:</strong> {agent.desc}</div>
              <div><strong>Triggered by:</strong> {agent.trigger}</div>
            </div>
          </Expandable>
        ))}
      </section>

      {/* RESEARCH ENGINE */}
      <section id="research">
        <h1 className="section-title">Research Engine</h1>
        <p className="section-subtitle">Multi-channel search, iterative research, and knowledge synthesis.</p>
        <ResearchPipeline/>
        <h3 style={{marginTop:24,marginBottom:16}}>How Research Works</h3>
        <div className="card">
          <strong>On /wiki-read:</strong> The research engine kicks in when existing wiki knowledge is insufficient.
          <ol style={{marginLeft:16, marginTop:12, fontSize:'13px', lineHeight:'1.7'}}>
            <li>Check wiki index and full-text search (wikireader agent)</li>
            <li>If coverage is poor, classify research complexity (simple/moderate/complex)</li>
            <li>search-orchestrator picks appropriate channels: web, academic, code, docs</li>
            <li>Each channel (search-channel agents) fetches and normalizes results</li>
            <li>research-processor deduplicates by URL, DOI, title similarity (>85%)</li>
            <li>If deep mode: research-loop runs iterative cycles (max 3), ingests findings, evaluates quality</li>
            <li>fact-checker agent verifies claims against external sources (10 claims/page, 3 searches/claim max)</li>
            <li>Final answer synthesized with [[citations]] and contradiction notes</li>
          </ol>
        </div>
        <SearchPipelineDiagram/>
        <h3 style={{marginTop:24,marginBottom:16}}>Search Channels</h3>
        <div className="grid-2">
          <div className="card">
            <strong>Web Search</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Public web via CloudSearch or Jina. 7-day cache, TF-IDF reranking.</p>
          </div>
          <div className="card">
            <strong>Academic</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>arXiv, Semantic Scholar, PubMed. 30-day cache, citation-graph aware.</p>
          </div>
          <div className="card">
            <strong>Code</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>GitHub, GitLab, Bitbucket via API. File-type filtering, snippet extraction.</p>
          </div>
          <div className="card">
            <strong>Docs</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Context7 MCP (if available) or fallback to site-restricted WebSearch.</p>
          </div>
        </div>
      </section>

      {/* SKILLS */}
      <section id="skills">
        <h1 className="section-title">Skills (Slash Commands)</h1>
        <p className="section-subtitle">Five main commands that drive all wiki operations.</p>
        <div className="tabs">
          {SKILLS.map((s, i) => (
            <button key={i} className={`tab ${skillTab === i ? 'active' : ''}`} onClick={() => setSkillTab(i)}>
              {s.cmd}
            </button>
          ))}
        </div>
        {SKILLS[skillTab] && (
          <div className="card">
            <div className="card-header">
              <div className="card-icon" style={{background:SKILLS[skillTab].color + '20'}}>{SKILLS[skillTab].cmd[1]}</div>
              <div>
                <div className="card-title">{SKILLS[skillTab].cmd}</div>
                <div className="card-desc">{SKILLS[skillTab].purpose}</div>
              </div>
            </div>
            <div style={{marginBottom:'16px', fontSize:'13px', lineHeight:'1.7'}}>{SKILLS[skillTab].details}</div>
            <strong style={{fontSize:'13px'}}>Examples:</strong>
            <div style={{marginTop:'8px'}}>
              {SKILLS[skillTab].examples.map((ex, i) => (
                <CodeBlock key={i} label="bash">{ex}</CodeBlock>
              ))}
            </div>
            <strong style={{fontSize:'13px', marginTop:'16px'}}>Flow:</strong>
            <FlowDiagram steps={SKILLS[skillTab].flow}/>
          </div>
        )}
      </section>

      {/* WEB UI */}
      <section id="webui">
        <h1 className="section-title">Web UI</h1>
        <p className="section-subtitle">Wikipedia-style browsable interface with graph, editor, and chat.</p>
        <StatsDashboard/>
        <h3 style={{marginTop:24,marginBottom:16}}>Features</h3>
        <div className="grid-2">
          <div className="card">
            <div className="card-header"><div className="card-icon" style={{background:'#f0fdf4'}}>🎨</div><div className="card-title">4 Themes</div></div>
            <div className="card-desc" style={{fontSize:'13px'}}>Light, dark, terminal, and Wikipedia-style themes. Instant switching.</div>
          </div>
          <div className="card">
            <div className="card-header"><div className="card-icon" style={{background:'#eff6ff'}}>📊</div><div className="card-title">Knowledge Graph</div></div>
            <div className="card-desc" style={{fontSize:'13px'}}>Interactive Cytoscape.js visualization. Drag, zoom, search within graph.</div>
          </div>
          <div className="card">
            <div className="card-header"><div className="card-icon" style={{background:'#fef3c7'}}>✏️</div><div className="card-title">Split Editor</div></div>
            <div className="card-desc" style={{fontSize:'13px'}}>Live markdown preview with AI assist. Save directly to wiki.</div>
          </div>
          <div className="card">
            <div className="card-header"><div className="card-icon" style={{background:'#f0f9ff'}}>💬</div><div className="card-title">WebSocket Chat</div></div>
            <div className="card-desc" style={{fontSize:'13px'}}>RAG-augmented Q&A sidebar. Real-time streaming responses.</div>
          </div>
        </div>
      </section>

      {/* QUALITY */}
      <section id="quality">
        <h1 className="section-title">Quality & Provenance</h1>
        <p className="section-subtitle">Maintaining accuracy, tracking sources, and verifying facts.</p>
        <CircuitBreaker/>
        <h3 style={{marginTop:24,marginBottom:16}}>Quality Gates</h3>
        <div className="grid-2">
          <div className="card">
            <strong>Confidence Levels</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)', marginBottom:'8px'}}>LOW, MEDIUM, HIGH with automatic promotion rules based on source count and fact-checking results.</p>
          </div>
          <div className="card">
            <strong>Source Tracking</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)', marginBottom:'8px'}}>Every claim links to original sources via frontmatter. W3C PROV compatibility.</p>
          </div>
          <div className="card">
            <strong>Contradiction Detection</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)', marginBottom:'8px'}}>Automatically flagged during /wiki-read when sources disagree.</p>
          </div>
          <div className="card">
            <strong>Fact-Checking</strong>
            <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)', marginBottom:'8px'}}>fact-checker agent verifies claims (10/page, 3 searches/claim). Assigns: verified, unverified, disputed, outdated.</p>
          </div>
        </div>
      </section>

      {/* CLI UTILITIES */}
      <section id="cli">
        <h1 className="section-title">CLI Utilities</h1>
        <p className="section-subtitle">23 modular Python scripts for advanced operations.</p>
        <div className="search-box">
          <span className="nav-icon">{Icons.search}</span>
          <input placeholder="Search utilities..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}/>
        </div>
        {CLI_UTILS.filter(u => u.name.toLowerCase().includes(searchTerm.toLowerCase()) || u.desc.toLowerCase().includes(searchTerm.toLowerCase())).map((util, i) => (
          <Expandable key={i} title={<code style={{fontSize:'13px'}}>{util.name}</code>}>
            <div style={{fontSize:'13px',color:'var(--text-muted)',marginTop:'4px'}}>{util.desc}</div>
          </Expandable>
        ))}
      </section>

      {/* DEPENDENCIES */}
      <section id="deps">
        <h1 className="section-title">Dependencies</h1>
        <p className="section-subtitle">External libraries, APIs, and runtime requirements.</p>
        <div style={{display:'flex', gap:'12px', marginBottom:'20px', flexWrap:'wrap'}}>
          {['all', 'required', 'external', 'builtin'].map(filter => (
            <button key={filter} onClick={() => setDepFilter(filter)}
                    style={{padding:'6px 14px', fontSize:'13px', fontWeight:'500', border:'1px solid var(--border)', borderRadius:'var(--radius)',
                            background: depFilter === filter ? 'var(--accent)' : 'transparent', color: depFilter === filter ? '#fff' : 'var(--text)', cursor:'pointer'}}>
              {filter.charAt(0).toUpperCase() + filter.slice(1)}
            </button>
          ))}
        </div>
        {filteredDeps.map((dep, i) => (
          <div key={i} className="dep-card">
            <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
              <div>
                <div className="dep-name">{dep.name}</div>
                <div style={{fontSize:'13px', color:'var(--text-muted)', marginTop:'4px'}}>{dep.desc}</div>
              </div>
              <div style={{display:'flex', gap:'8px', flexShrink:0}}>
                <Badge color={dep.type === 'required' ? 'red' : dep.type === 'external' ? 'amber' : 'green'}>{dep.type}</Badge>
                <Badge color="gray">{dep.cat}</Badge>
              </div>
            </div>
          </div>
        ))}
      </section>

      {/* QUICK START */}
      <section id="quickstart">
        <h1 className="section-title">Quick Start</h1>
        <p className="section-subtitle">Get up and running in 5 minutes.</p>
        <div className="step"><div className="step-num">1</div><div className="step-body">
          <div className="step-title">Install Plugin</div>
          <CodeBlock label="bash">claude plugin install ./llm-wiki</CodeBlock>
        </div></div>
        <div className="step"><div className="step-num">2</div><div className="step-body">
          <div className="step-title">First Wiki Page</div>
          <CodeBlock label="bash">/wiki-write "Claude is an AI assistant made by Anthropic"</CodeBlock>
        </div></div>
        <div className="step"><div className="step-num">3</div><div className="step-body">
          <div className="step-title">Search Your Wiki</div>
          <CodeBlock label="bash">/wiki-read What do you know about Claude?</CodeBlock>
        </div></div>
        <div className="step"><div className="step-num">4</div><div className="step-body">
          <div className="step-title">Launch Web UI</div>
          <CodeBlock label="bash">/wiki-serve</CodeBlock>
        </div></div>
        <div className="step"><div className="step-num">5</div><div className="step-body">
          <div className="step-title">Maintain Your Wiki</div>
          <CodeBlock label="bash">/wiki-maintain</CodeBlock>
        </div></div>
      </section>

      {/* INSTALLATION */}
      <section id="install">
        <h1 className="section-title">Installation</h1>
        <p className="section-subtitle">Step-by-step setup for Claude Code environments.</p>
        <h3 style={{marginTop:20,marginBottom:16}}>Prerequisites</h3>
        <div className="table-wrap"><table><thead><tr><th>Requirement</th><th>Version</th><th>Purpose</th></tr></thead><tbody>
          <tr><td><code>Claude Code</code></td><td>Latest</td><td>Plugin host environment</td></tr>
          <tr><td><code>Python</code></td><td>3.10+</td><td>All bin/ scripts, MCP server, web server</td></tr>
          <tr><td><code>pip</code></td><td>Latest</td><td>Dependency installation</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:16}}>Setup Steps</h3>
        <div className="step"><div className="step-num">1</div><div className="step-body">
          <div className="step-title">Install the Plugin</div>
          <div className="step-desc">Install via CLI or copy manually into the plugins directory.</div>
          <CodeBlock label="bash">claude plugin install ./llm-wiki</CodeBlock>
          <Callout type="info">Or manually: <code>cp -r llm-wiki .claude/plugins/</code></Callout>
        </div></div>
        <div className="step"><div className="step-num">2</div><div className="step-body">
          <div className="step-title">Restart Claude Code</div>
          <div className="step-desc">Dependencies (fastapi, uvicorn, mcp, etc.) install automatically on first session via the SessionStart hook.</div>
          <CodeBlock label="bash">/wiki-write, /wiki-read, /wiki-serve, /wiki-maintain, /wiki-view</CodeBlock>
        </div></div>
      </section>

      {/* RULES & BEHAVIOR */}
      <section id="rules">
        <h1 className="section-title">Rules & Behavior</h1>
        <p className="section-subtitle">Operating principles and configuration.</p>
        <div className="card">
          <strong>Automatic Rules</strong>
          <ul style={{marginLeft:16, marginTop:12, fontSize:'13px', lineHeight:'1.7'}}>
            <li>All wiki pages are version-controlled (git) with author attribution</li>
            <li>Concurrent writes protected by .lock files</li>
            <li>Deleted pages moved to trash/ instead of permanent deletion</li>
            <li>All [[links]] are bidirectional (backlinks auto-maintained)</li>
            <li>Page slugs auto-generated via title → snake_case</li>
            <li>Frontmatter required: slug, type, confidence minimum</li>
            <li>Search cache: web/docs 7d, academic 30d, code 14d</li>
            <li>Circuit breaker: 5 failures → open state, 300s cooldown before half-open test</li>
          </ul>
        </div>
      </section>

      {/* CUSTOM TYPES */}
      <section id="custom-types">
        <h1 className="section-title">Custom Page Types</h1>
        <p className="section-subtitle">Define your own page types with custom templates and validation.</p>
        <div className="card">
          <strong>Creating a Custom Type</strong>
          <p style={{fontSize:'13px', marginTop:'12px', marginBottom:'12px', color:'var(--text-muted)'}}>Create a Jinja2 template in <code>.wiki/templates/</code>:</p>
          <CodeBlock label="jinja2">{`.wiki/templates/meeting-notes.jinja2

---
slug: {{ slug }}
title: {{ title }}
type: meeting-notes
date: {{ date }}
attendees: {{ attendees }}
decisions: []
action_items: []
---

# {{ title }}

**Date:** {{ date }}
**Attendees:** {{ attendees }}

## Agenda

...

## Decisions

...

## Action Items

...`}</CodeBlock>
        </div>
      </section>

      {/* SEARCH */}
      <section id="search">
        <h1 className="section-title">Search & Retrieval</h1>
        <p className="section-subtitle">How search works internally and how to optimize queries.</p>
        <div className="card">
          <strong>TF-IDF Full-Text Search</strong>
          <p style={{fontSize:'13px', marginTop:'12px', marginBottom:'12px', lineHeight:'1.7', color:'var(--text-muted)'}}>All pages are indexed with term frequency-inverse document frequency scoring. Title matches are boosted 2x, paragraph matches 1x. Stop words (the, a, and, etc.) are filtered. Each query is tokenized and matched against the index, returning ranked results with snippets extracted around match locations.</p>
        </div>
      </section>

      {/* TROUBLESHOOTING */}
      <section id="troubleshooting">
        <h1 className="section-title">Troubleshooting</h1>
        <p className="section-subtitle">Common issues and solutions.</p>
        <Expandable title="Commands not appearing after install">
          <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Restart Claude Code or run /reload-plugins. Verify requirements.txt was installed correctly. Check that llm-wiki/ is in .claude/plugins/.</p>
        </Expandable>
        <Expandable title="Web UI won't start">
          <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Port 8420 may be in use. Try a different port: /wiki-serve --port 8421. Check Python version (3.10+). Verify FastAPI is installed.</p>
        </Expandable>
        <Expandable title="Search results not appearing">
          <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Run /wiki-maintain to rebuild the search index. Check that pages have proper frontmatter. Try a simpler query (fewer words).</p>
        </Expandable>
        <Expandable title="Broken [[links]] detected">
          <p style={{fontSize:'13px', marginTop:'8px', color:'var(--text-muted)'}}>Run /wiki-maintain lint to auto-fix. If pages were renamed, backlink-manager should sync automatically. Check the backlinks index: backlinks.py verify</p>
        </Expandable>
      </section>

    </main>
  </>;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
