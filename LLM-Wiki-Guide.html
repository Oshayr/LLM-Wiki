<style>
:root {
  --bg: #fafaf9; --bg-alt: #f5f5f4; --bg-card: #ffffff; --border: #e7e5e4;
  --text: #1c1917; --text-muted: #78716c; --text-light: #a8a29e;
  --accent: #0f766e; --accent-light: #ccfbf1; --accent-hover: #115e59;
  --code-bg: #1e293b; --code-text: #e2e8f0;
  --warn: #d97706; --warn-bg: #fffbeb; --warn-border: #fde68a;
  --info: #0284c7; --info-bg: #f0f9ff; --info-border: #bae6fd;
  --success: #16a34a; --success-bg: #f0fdf4; --success-border: #bbf7d0;
  --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fecaca;
  --sidebar-w: 280px; --header-h: 56px;
  --radius: 6px; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { font-family:'IBM Plex Sans',system-ui,sans-serif; color:var(--text); background:var(--bg); line-height:1.65; font-size:15px; }
h1,h2,h3,h4 { font-family:'Fraunces',Georgia,serif; font-weight:700; line-height:1.25; }
.header { position:fixed; top:0; left:0; right:0; height:var(--header-h); background:var(--bg-card);
  border-bottom:1px solid var(--border); display:flex; align-items:center; padding:0 24px; z-index:100; backdrop-filter:blur(12px); }
.header-logo { font-family:'Fraunces',serif; font-size:20px; font-weight:700; color:var(--accent); }
.header-logo span { color:var(--text-muted); font-weight:400; font-size:14px; margin-left:8px; }
.header-badge { margin-left:12px; font-size:11px; font-weight:600; background:var(--accent-light); color:var(--accent); padding:2px 8px; border-radius:99px; }
.header-right { margin-left:auto; display:flex; gap:12px; align-items:center; }
.header-right a { font-size:13px; color:var(--text-muted); text-decoration:none; }
.header-right a:hover { color:var(--accent); }
.version-tag { font-size:11px; background:var(--bg-alt); border:1px solid var(--border); padding:2px 8px; border-radius:4px; color:var(--text-muted); }
.sidebar { position:fixed; top:var(--header-h); left:0; bottom:0; width:var(--sidebar-w);
  background:var(--bg-card); border-right:1px solid var(--border); overflow-y:auto; padding:16px 0; z-index:90; transition:transform .2s; }
.sidebar::-webkit-scrollbar { width:4px; } .sidebar::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }
.nav-section { padding:0 16px; margin-bottom:4px; }
.nav-section-label { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--text-light); padding:12px 0 4px; }
.nav-item { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:var(--radius);
  font-size:13.5px; color:var(--text-muted); cursor:pointer; transition:all .12s; text-decoration:none; }
.nav-item:hover { background:var(--bg-alt); color:var(--text); }
.nav-item.active { background:var(--accent-light); color:var(--accent); font-weight:500; }
.nav-icon { width:16px; height:16px; flex-shrink:0; opacity:.6; }
.nav-item.active .nav-icon { opacity:1; }
.main { margin-left:var(--sidebar-w); margin-top:var(--header-h); padding:32px 48px 80px; max-width:960px; }
.main section { margin-bottom:56px; }
.section-title { font-size:28px; color:var(--text); margin-bottom:6px; }
.section-subtitle { font-size:15px; color:var(--text-muted); margin-bottom:24px; }
.card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; margin-bottom:16px; box-shadow:var(--shadow); }
.card-header { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.card-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
.card-title { font-family:'Fraunces',serif; font-size:17px; font-weight:700; }
.card-desc { font-size:14px; color:var(--text-muted); line-height:1.6; }
.code-block { background:var(--code-bg); color:var(--code-text); border-radius:var(--radius); padding:16px 20px; margin:12px 0; font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.7; overflow-x:auto; position:relative; }
.code-block .code-label { position:absolute; top:8px; right:12px; font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:.05em; }
code { font-family:'IBM Plex Mono',monospace; font-size:13px; background:var(--bg-alt); padding:1px 5px; border-radius:3px; color:var(--accent); }
.callout { border-radius:var(--radius); padding:14px 18px; margin:14px 0; font-size:14px; display:flex; gap:10px; }
.callout-icon { font-size:16px; flex-shrink:0; margin-top:1px; }
.callout.info { background:var(--info-bg); border:1px solid var(--info-border); color:#0c4a6e; }
.callout.warn { background:var(--warn-bg); border:1px solid var(--warn-border); color:#92400e; }
.callout.success { background:var(--success-bg); border:1px solid var(--success-border); color:#14532d; }
.callout.danger { background:var(--danger-bg); border:1px solid var(--danger-border); color:#7f1d1d; }
.table-wrap { overflow-x:auto; margin:12px 0; }
table { width:100%; border-collapse:collapse; font-size:13.5px; }
th { text-align:left; font-weight:600; padding:10px 14px; background:var(--bg-alt); border-bottom:2px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); }
td { padding:10px 14px; border-bottom:1px solid var(--border); vertical-align:top; }
tr:hover td { background:var(--bg-alt); }
.badge { display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; letter-spacing:.02em; }
.badge.green { background:#dcfce7; color:#166534; } .badge.blue { background:#dbeafe; color:#1e40af; }
.badge.amber { background:#fef3c7; color:#92400e; } .badge.red { background:#fee2e2; color:#991b1b; }
.badge.gray { background:#f3f4f6; color:#4b5563; } .badge.teal { background:var(--accent-light); color:var(--accent); }
.step { display:flex; gap:16px; margin-bottom:20px; }
.step-num { width:28px; height:28px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; margin-top:2px; }
.step-body { flex:1; } .step-title { font-weight:600; font-size:15px; margin-bottom:4px; }
.step-desc { font-size:14px; color:var(--text-muted); }
.diagram { background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); padding:24px; margin:16px 0; overflow-x:auto; }
.diagram svg { display:block; margin:0 auto; }
.tabs { display:flex; gap:2px; border-bottom:2px solid var(--border); margin-bottom:16px; }
.tab { padding:8px 16px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .12s; }
.tab:hover { color:var(--text); } .tab.active { color:var(--accent); border-bottom-color:var(--accent); }
.expand-header { display:flex; align-items:center; gap:8px; cursor:pointer; padding:10px 0; user-select:none; }
.expand-header:hover { color:var(--accent); }
.expand-arrow { transition:transform .2s; font-size:12px; } .expand-arrow.open { transform:rotate(90deg); }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.grid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
.flow-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:12px 0; }
.flow-box { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; font-size:13px; font-weight:500; white-space:nowrap; }
.flow-arrow { color:var(--text-light); font-size:18px; }
.search-box { display:flex; align-items:center; gap:8px; background:var(--bg-alt); border:1px solid var(--border); border-radius:var(--radius); padding:8px 14px; margin-bottom:20px; }
.search-box input { flex:1; border:none; background:none; outline:none; font-size:14px; font-family:inherit; color:var(--text); }
.search-box input::placeholder { color:var(--text-light); }
.dep-card { background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; margin-bottom:8px; }
.dep-card .dep-name { font-weight:600; font-size:14px; } .dep-card .dep-type { font-size:11px; font-weight:600; }
.mobile-toggle { display:none; background:none; border:none; cursor:pointer; padding:8px; }
@media(max-width:860px) {
  .sidebar { transform:translateX(-100%); } .sidebar.open { transform:translateX(0); }
  .main { margin-left:0; padding:24px 20px 80px; }
  .mobile-toggle { display:block; } .grid-2,.grid-3 { grid-template-columns:1fr; }
}
</style>

        <div className="card">
          <div className="card-header"><div className="card-icon" style={{background:'#f0fdf4'}}>📖</div><div><div className="card-title">The Karpathy Pattern</div></div></div>
          <div className="card-desc">
            <p>LLM-Wiki implements <a href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f" target="_blank" rel="noopener">Andrej Karpathy's LLM Wiki pattern</a>. Instead of traditional RAG where the LLM rediscovers knowledge from raw documents on every query, the LLM pre-compiles source materials into a structured, interlinked wiki of markdown files. Raw sources remain immutable in <code>raw/</code>, the LLM maintains the wiki layer in <code>pages/</code>, and a schema governs quality standards. Knowledge compounds over time.</p>
            <br/><p>Every claim traces back to a specific <code>.md</code> file that can be read, edited, or deleted. The wiki is compatible with Obsidian — open <code>.wiki/</code> as a vault for graph visualization and editing.</p>
          </div>
        </div>

          <div className="card"><strong>2. Wiki grows</strong><p className="card-desc" style={{marginTop:4}}>Research findings, ideas, decisions, and patterns accumulate as interlinked pages with confidence levels and source citations.</p></div>
          <div className="card"><strong>3. Wiki serves you</strong><p className="card-desc" style={{marginTop:4}}>Claude checks the wiki first when you ask questions, citing existing knowledge with <code>[[slug]]</code> references before searching the web.</p></div>
          <div className="card"><strong>4. Wiki maintains itself</strong><p className="card-desc" style={{marginTop:4}}>Periodic lint, deduplication, confidence upgrades, stale detection, and gap analysis keep the knowledge base healthy.</p></div>
        </div>
        <h3 style={{marginTop:24,marginBottom:12}}>Capabilities</h3>
        <div className="table-wrap"><table><thead><tr><th>Category</th><th>Features</th></tr></thead><tbody>
          <tr><td><Badge color="green">Knowledge</Badge></td><td>Auto-capture, TF-IDF full-text search, block references, backlinks, frontmatter queries, custom page types</td></tr>
          <tr><td><Badge color="blue">Research</Badge></td><td>Web search, autonomous research loops, fact-checking, provenance</td></tr>
          <tr><td><Badge color="amber">Web UI</Badge></td><td>4 themes, Cytoscape.js knowledge graph, canvas view, split editor, WebSocket chat, FSRS review</td></tr>

        <h3 style={{marginTop:24,marginBottom:12}}>Layer Breakdown</h3>
        <Expandable title="User Layer" defaultOpen={true}>
          <p style={{fontSize:14,color:'var(--text-muted)'}}>Users interact through five entry points. <strong>Claude Code</strong> is the primary interface where skills are invoked as slash commands and agents activate automatically. The <strong>Web UI</strong> at <code>localhost:8420</code> provides a visual browsable experience (only runs when invoked). <strong>MCP Clients</strong> can call wiki tools programmatically via the FastMCP server. <strong>Obsidian</strong> can open the <code>.wiki/</code> directory as a vault. The <strong>CLI</strong> allows direct script invocation.</p>
        </Expandable>
        <Expandable title="Agent Layer — 9 Agents">
          <p style={{fontSize:14,color:'var(--text-muted)'}}>Agents are Claude subprocesses defined as markdown prompts in <code>agents/</code>. They activate automatically based on context. The wiki-writer and wiki-reader handle CRUD operations. The search-orchestrator fans out research to search-channel subagents. The research-loop runs iterative deep-dives. The fact-checker and citation-explorer handle quality assurance. The wiki-auditor performs health maintenance. The research-processor deduplicates and condenses parallel results.</p>
        </Expandable>
        <Expandable title="Utilities Layer — 18 CLI Scripts">
          <p style={{fontSize:14,color:'var(--text-muted)'}}>The <code>bin/</code> directory contains Python scripts that handle deterministic operations without requiring LLM calls. These cover search (full-text TF-IDF, academic APIs, code registries), data management (backlinks, cache, embeddings), quality (claims, provenance), utilities (daily notes, diffs, export, flashcards), and infrastructure (structured logging, custom exceptions, circuit breakers). Agents call these scripts as tools during execution.</p>
        </Expandable>
        <Expandable title="Server Layer — MCP + FastAPI">
          <p style={{fontSize:14,color:'var(--text-muted)'}}>Two servers. The <strong>MCP Server</strong> (<code>mcp/wiki-mcp-server.py</code>) exposes 9 wiki tools via the <a href="https://modelcontextprotocol.io/specification/2025-11-25" target="_blank" rel="noopener">Model Context Protocol</a>, allowing any MCP-compatible client to search, read, write, and query the wiki. The <strong>FastAPI Web Server</strong> (<code>skills/serve/scripts/server.py</code>) powers the web UI — it only starts when <code>/wiki-serve</code> is invoked or launched manually via CLI.</p>
        </Expandable>
        <Expandable title="Data Layer — .wiki/">
          <p style={{fontSize:14,color:'var(--text-muted)'}}>All wiki data lives in <code>.wiki/</code> in the current working directory. Location can be overridden by the user. Markdown files in <code>pages/</code> are the source of truth. <code>templates/</code> holds custom page type templates. <code>cache/</code> holds SQLite databases for search indexes, vector embeddings, backlinks, flashcards, and provenance. <code>raw/</code> stores immutable source materials. Three manifest files (<code>index.md</code>, <code>log.md</code>, <code>overview.md</code>) provide system-wide views.</p>
        </Expandable>
      </section>

      {/* DATA MODEL */}
      <section id="data-model">
        <h1 className="section-title">Data Model</h1>
        <p className="section-subtitle">How wiki data is structured, stored, and interconnected.</p>
        <h3 style={{marginTop:12,marginBottom:12}}>Page Frontmatter Schema</h3>
        <CodeBlock label="yaml">{`---
title: "Transformer Architecture"
type: concept
confidence: high
sources:
  - https://arxiv.org/abs/1706.03762
  - https://jalammar.github.io/illustrated-transformer/
tags: [ml, nlp, attention, deep-learning]
related: [attention-mechanism, bert, gpt-architecture]
created: 2026-03-15
updated: 2026-04-08
---`}</CodeBlock>
        <h3 style={{marginTop:24,marginBottom:12}}>Confidence Tiers</h3>
        <div className="table-wrap"><table><thead><tr><th>Level</th><th>Criteria</th></tr></thead><tbody>
          <tr><td><Badge color="green">high</Badge></td><td>3+ corroborating independent sources</td></tr>
          <tr><td><Badge color="amber">medium</Badge></td><td>2+ independent sources</td></tr>
          <tr><td><Badge color="red">low</Badge></td><td>Single source or speculation</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Page Types</h3>
        <div className="table-wrap"><table><thead><tr><th>Type</th><th>Description</th></tr></thead><tbody>
          {[["concept","Standard knowledge article"],["idea","Problem/solution evaluation"],["brainstorming","Freeform ideas list"],["status","Metrics, action items, blockers"],["rules","Numbered rules/policies"],["config","Key-value settings"],["skill","Command/tool documentation"],["memory","Persistent facts"],["reference","External resource links"],["custom","User-defined via .wiki/templates/"]].map(([t,d])=>
            <tr key={t}><td><code>{t}</code></td><td>{d}</td></tr>)}
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Wiki Links & Transclusion</h3>
        <div className="table-wrap"><table><thead><tr><th>Syntax</th><th>Description</th></tr></thead><tbody>
          <tr><td><code>[[slug]]</code></td><td>Link to a wiki page</td></tr>
          <tr><td><code>[[slug#heading]]</code></td><td>Link to a specific section</td></tr>
          <tr><td><code>![[slug#section]]</code></td><td>Transclude (embed) a section inline</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Directory Structure</h3>
        <CodeBlock label=".wiki/">{`.wiki/
  pages/          Markdown files with YAML frontmatter (source of truth)
  templates/      Custom page type templates
  index.md        Auto-generated page catalog
  log.md          Append-only activity log
  overview.md     Current understanding synthesis
  cache/          SQLite databases (search, backlinks, flashcards, provenance)
  raw/            Immutable source materials (web, papers, code, transcripts)`}</CodeBlock>
      </section>

      {/* MCP SERVER */}
      <section id="mcp">
        <h1 className="section-title">MCP Server</h1>
        <p className="section-subtitle">Exposes wiki operations as tools via the <a href="https://modelcontextprotocol.io/specification/2025-11-25" target="_blank" rel="noopener">Model Context Protocol</a>.</p>
        <h3 style={{marginTop:12,marginBottom:12}}>Configuration</h3>
        <CodeBlock label="plugin.json">{`"mcpServers": {
  "wiki-mcp": {
    "command": "python3",
    "args": ["\${PLUGIN_ROOT}/mcp/wiki-mcp-server.py"]
  }
}`}</CodeBlock>
        <h3 style={{marginTop:24,marginBottom:12}}>Tools (9)</h3>
        <div className="table-wrap"><table><thead><tr><th>Tool</th><th>Arguments</th><th>Description</th></tr></thead><tbody>
          {MCP_TOOLS.map(t => <tr key={t.name}><td><code>{t.name}</code></td><td style={{fontFamily:'IBM Plex Mono',fontSize:12,color:'var(--text-muted)'}}>{t.args}</td><td>{t.desc}</td></tr>)}
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Query Examples</h3>
        <CodeBlock label="wiki_query">{`SELECT title, confidence, updated FROM pages
  WHERE type = "concept" AND confidence = "high"
  SORT updated DESC

COUNT pages WHERE tags CONTAINS "ml"

LIST sources FROM "transformer-architecture"`}</CodeBlock>
      </section>

      {/* SKILLS */}
      <section id="skills">
        <h1 className="section-title">Skills (Commands)</h1>
        <p className="section-subtitle">6 slash commands. Primary interface to LLM-Wiki.</p>
        <div className="tabs">{SKILLS.map((s,i) => <div key={s.cmd} className={`tab ${skillTab===i?'active':''}`} onClick={()=>setSkillTab(i)}>{s.cmd}</div>)}</div>
        {(() => { const s = SKILLS[skillTab]; return <div className="card" style={{borderLeft:`4px solid ${s.color}`}}>
          <div className="card-header"><div><div className="card-title" style={{color:s.color}}>{s.cmd} {s.args && <span style={{fontWeight:400,color:'var(--text-muted)',fontSize:14}}>{s.args}</span>}</div>
          <div style={{fontSize:13,color:'var(--text-muted)',marginTop:2}}>{s.purpose}</div></div></div>
          <h4 style={{fontSize:14,fontFamily:'IBM Plex Sans',fontWeight:600,marginBottom:8,marginTop:8}}>Description</h4>
          <p className="card-desc">{s.details}</p>
          <h4 style={{fontSize:14,fontFamily:'IBM Plex Sans',fontWeight:600,marginBottom:8,marginTop:16}}>Usage Examples</h4>
          {s.examples.map((e,i) => <CodeBlock key={i}>{e}</CodeBlock>)}
          <h4 style={{fontSize:14,fontFamily:'IBM Plex Sans',fontWeight:600,marginBottom:8,marginTop:16}}>Processing Flow</h4>
          <FlowDiagram steps={s.flow}/>
        </div>; })()}
      </section>

      {/* AGENTS */}
      <section id="agents">
        <h1 className="section-title">Agents</h1>
        <p className="section-subtitle">9 autonomous agents that activate automatically based on conversation context. Defined as markdown prompts in <code>agents/</code>.</p>
        {AGENTS.map(a => <div key={a.name} className="card" style={{borderLeft:`4px solid ${a.color}`}}>
          <div className="card-header">
            <div className="card-icon" style={{background:a.color+'18',color:a.color,fontSize:14,fontWeight:700}}>{a.name.split('-').map(w=>w[0]).join('').toUpperCase()}</div>
            <div><div className="card-title">{a.name}</div><div style={{fontSize:11,color:'var(--text-muted)',marginTop:2}}>Trigger: {a.trigger}</div></div>
          </div>
          <div className="card-desc">{a.desc}</div>
        </div>)}
        <h3 style={{marginTop:24,marginBottom:12}}>Agent Chain: Research Deep-Dive</h3>
        <div className="diagram">
          <svg width="720" height="170" viewBox="0 0 720 170" style={{fontFamily:'IBM Plex Sans,sans-serif'}}>
            {[["research-loop",30,"Iterate"],["search-orch.",170,"Fan out"],["search-channel",310,"Fetch"],["research-proc.",450,"Merge"],["wiki-writer",590,"Save"]].map(([label,x,sub],i) => (
              <React.Fragment key={i}>
                {i>0 && <line x1={x-30} y1="55" x2={x} y2="55" stroke="#a8a29e" strokeWidth="1.5" markerEnd="url(#arr3)"/>}
                <rect x={x} y="30" width="120" height="48" rx="6" fill="#eff6ff" stroke="#93c5fd" strokeWidth="1.5"/>
                <text x={x+60} y="50" textAnchor="middle" fontSize="10" fontWeight="600" fill="#1e40af">{label}</text>
                <text x={x+60} y="67" textAnchor="middle" fontSize="9" fill="#3b82f6">{sub}</text>
              </React.Fragment>))}
            <line x1="650" y1="78" x2="650" y2="105" stroke="#a8a29e" strokeWidth="1.5" markerEnd="url(#arr3)"/>
            <rect x="590" y="105" width="120" height="36" rx="6" fill="#fef2f2" stroke="#fecaca" strokeWidth="1.5"/>
            <text x="650" y="123" textAnchor="middle" fontSize="10" fontWeight="600" fill="#dc2626">fact-checker</text>
            <text x="650" y="135" textAnchor="middle" fontSize="9" fill="#ef4444">Verify claims</text>
            <line x1="370" y1="78" x2="370" y2="105" stroke="#a8a29e" strokeWidth="1.5" markerEnd="url(#arr3)"/>
            <rect x="310" y="105" width="120" height="36" rx="6" fill="#ecfeff" stroke="#a5f3fc" strokeWidth="1.5"/>
            <text x="370" y="123" textAnchor="middle" fontSize="10" fontWeight="600" fill="#0891b2">citation-explorer</text>
            <text x="370" y="135" textAnchor="middle" fontSize="9" fill="#06b6d4">Snowball refs</text>
            <defs><marker id="arr3" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a29e"/></marker></defs>
          </svg>
        </div>
      </section>

      {/* WEB UI */}
      <section id="webui">
        <h1 className="section-title">Web UI</h1>
        <p className="section-subtitle">Wikipedia-style browsable website launched via <code>/wiki-serve</code> on <code>localhost:8420</code>. Only runs when explicitly invoked.</p>
        <Callout type="info">The web server does not start automatically. Invoke <code>/wiki-serve</code> or launch manually: <code>python skills/serve/scripts/server.py --wiki-dir .wiki/ --port 8420</code></Callout>
        <h3 style={{marginBottom:12,marginTop:16}}>Pages & Features</h3>
        <div className="grid-2">
          {[{title:"Home",desc:"Search, stats, recent pages, active research tasks."},{title:"Wiki Page",desc:"Article view with TOC, metadata, sources, related pages, backlinks, red-link research buttons."},{title:"Knowledge Graph",desc:"Interactive Cytoscape.js visualization with force-directed layout, filtering, clustering, and legend."},{title:"Canvas View",desc:"Spatial whiteboard for arranging wiki pages visually."},{title:"Split-Pane Editor",desc:"Markdown editor with live preview, formatting toolbar, and AI assist presets."},{title:"Search",desc:"Full-text search with pagination. Option to research missing topics."},{title:"Spaced Repetition",desc:"FSRS-based flashcard review. Cards from wiki content: questions, definitions, takeaways. 4-button rating."},{title:"Gap Analysis",desc:"Missing pages (red links), depth gaps, stale content, structural holes."},{title:"Research Dashboard",desc:"Task queue with priority, SSE progress streaming, cancel/retry."},{title:"Chat Sidebar",desc:"WebSocket chat with RAG-augmented Q&A. Streams cited answers from wiki context."}
          ].map(f => <div key={f.title} className="card"><strong>{f.title}</strong><p className="card-desc" style={{marginTop:4}}>{f.desc}</p></div>)}
        </div>
        <h3 style={{marginTop:24,marginBottom:12}}>Themes</h3>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr',gap:12}}>
          {[{name:"Light",bg:"#fff",fg:"#1c1917",accent:"#0f766e"},{name:"Dark",bg:"#1e1e1e",fg:"#d4d4d4",accent:"#4ec9b0"},{name:"Terminal",bg:"#0a0a0a",fg:"#00ff00",accent:"#00ff00"},{name:"Wikipedia",bg:"#f8f9fa",fg:"#202122",accent:"#0645ad"}].map(t =>
            <div key={t.name} style={{background:t.bg,color:t.fg,border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'12px 16px',textAlign:'center'}}>
              <div style={{fontWeight:600,fontSize:13}}>{t.name}</div>
              <div style={{width:24,height:4,background:t.accent,borderRadius:2,margin:'6px auto 0'}}/>
            </div>)}
        </div>
        <h3 style={{marginTop:24,marginBottom:12}}>Live Research Flow</h3>
        <FlowDiagram steps={["Click red link","Queue research task","Worker spawns Claude","SSE streams progress","Page created","Redirect to new page"]}/>
      </section>

      {/* CLI UTILITIES */}
      <section id="cli">
        <h1 className="section-title">CLI Utilities</h1>
        <p className="section-subtitle">24 Python scripts in <code>bin/</code> providing deterministic operations.</p>
        <div className="search-box"><span style={{color:'var(--text-light)'}}>🔍</span>
          <input placeholder="Filter utilities..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)}/></div>
        <div className="table-wrap"><table><thead><tr><th>Script</th><th>Description</th></tr></thead><tbody>
          {CLI_UTILS.filter(u => !searchTerm || u.name.includes(searchTerm.toLowerCase()) || u.desc.toLowerCase().includes(searchTerm.toLowerCase())).map(u =>
            <tr key={u.name}><td><code>{u.name}</code></td><td style={{fontSize:13}}>{u.desc}</td></tr>)}
        </tbody></table></div>
      </section>

      {/* SEARCH */}
      <section id="search">
        <h1 className="section-title">Search & Retrieval</h1>
        <p className="section-subtitle">TF-IDF full-text search with content-aware scoring and snippet extraction.</p>
        <SearchPipelineDiagram />
        <h3 style={{marginTop:16,marginBottom:12}}>TF-IDF Full-Text Search</h3>
        <p style={{fontSize:14,color:'var(--text-muted)',marginBottom:12}}>Implemented in <code>search-fulltext.py</code>. Builds an in-memory TF-IDF index across all <code>.md</code> files. Stop-word filtering, content-aware score boosts (title match: +0.5, first paragraph match: +0.3 per term), and best-match snippet extraction. Pure Python standard library — no external dependencies.</p>
        <h3 style={{marginTop:16,marginBottom:12}}>Caching Architecture</h3>
        <div className="table-wrap"><table><thead><tr><th>Layer</th><th>Contents</th><th>TTL</th></tr></thead><tbody>
          <tr><td>L1 — Search</td><td>Per-channel results</td><td>web:7d, docs:7d</td></tr>
          <tr><td>L2 — Merged</td><td>Ranked search output</td><td>3 days</td></tr>
        </tbody></table></div>
      </section>

      {/* RESEARCH */}
      <section id="research">
        <h1 className="section-title">Research Engine</h1>
        <p className="section-subtitle">Web search with autonomous iteration and fact-checking.</p>
        <h3 style={{marginBottom:12}}>Search Channels</h3>
        <div className="table-wrap"><table><thead><tr><th>Channel</th><th>Sources</th><th>Cache TTL</th><th>Status</th></tr></thead><tbody>
          <tr><td><Badge color="blue">Web</Badge></td><td>Claude Code WebSearch → Jina Reader / Trafilatura</td><td>7 days</td><td><Badge color="green">built-in</Badge></td></tr>
          <tr><td><Badge color="teal">Docs</Badge></td><td>Context7 MCP (fallback: WebSearch + site filters)</td><td>7 days</td><td><Badge color="amber">optional MCP</Badge></td></tr>
        </tbody></table></div>
        <Callout type="warn">The <strong>Docs</strong> channel uses the <strong>Context7 MCP server</strong> if installed. If Context7 is not available, it falls back to WebSearch with site-specific filters. Context7 requires separate installation.</Callout>
        <h3 style={{marginTop:24,marginBottom:12}}>Credibility Ranking</h3>
        <div className="table-wrap"><table><thead><tr><th>Tier</th><th>Source Types</th><th>Weight</th></tr></thead><tbody>
          <tr><td><Badge color="green">Tier 1</Badge></td><td>Peer-reviewed journals, official documentation, government sources</td><td>1.0</td></tr>
          <tr><td><Badge color="amber">Tier 2</Badge></td><td>Reputable blogs, conference papers, well-known repos</td><td>0.7</td></tr>
          <tr><td><Badge color="red">Tier 3</Badge></td><td>Forums, social media, unverified personal sites</td><td>0.4</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Deduplication Pipeline</h3>
        <FlowDiagram steps={["Exact URL match","DOI match","Title similarity >85%","Content hash","Rank & output top 10–20"]}/>
      </section>

      {/* QUALITY */}
      <section id="quality">
        <h1 className="section-title">Quality & Provenance</h1>
        <p className="section-subtitle">Fact-checking, claim tracking, and W3C PROV-inspired provenance chains.</p>
        <h3 style={{marginBottom:12}}>Fact-Checking Pipeline</h3>
        <FlowDiagram steps={["Read target page","Extract claims","Classify type","WebSearch verify","Assign status","Update page"]}/>
        <div className="table-wrap" style={{marginTop:12}}><table><thead><tr><th>Verification Status</th><th>Meaning</th></tr></thead><tbody>
          <tr><td><Badge color="green">verified</Badge></td><td>2+ independent sources confirm the claim</td></tr>
          <tr><td><Badge color="gray">unverified</Badge></td><td>Unable to find confirming or denying sources</td></tr>
          <tr><td><Badge color="amber">disputed</Badge></td><td>Sources disagree — both views noted</td></tr>
          <tr><td><Badge color="red">outdated</Badge></td><td>Superseded by newer information</td></tr>
        </tbody></table></div>
        <h3 style={{marginTop:24,marginBottom:12}}>Provenance Tracking</h3>
        <p style={{fontSize:14,color:'var(--text-muted)',marginBottom:8}}>Implemented in <code>provenance.py</code> following the <a href="https://www.w3.org/TR/prov-overview/" target="_blank" rel="noopener">W3C PROV</a> model. Every fact traces from its wiki page through the activity that created it to the original source material.</p>
        <h3 style={{marginTop:24,marginBottom:12}}>Structured Logging</h3>
        <p style={{fontSize:14,color:'var(--text-muted)',marginBottom:8}}>All bin/ scripts and server components use <code>wiki_logging.py</code> for structured logging. Configurable via environment variables:</p>
        <div className="table-wrap"><table><thead><tr><th>Variable</th><th>Values</th><th>Default</th></tr></thead><tbody>
          <tr><td><code>WIKI_LOG_LEVEL</code></td><td>DEBUG, INFO, WARNING, ERROR</td><td>INFO</td></tr>
          <tr><td><code>WIKI_LOG_FORMAT</code></td><td>text (colored) or json (structured)</td><td>text</td></tr>
          <tr><td><code>WIKI_LOG_FILE</code></td><td>File path for log output</td><td>(none)</td></tr>
        </tbody></table></div>
        <p style={{fontSize:14,color:'var(--text-muted)',marginTop:8}}>Custom exception hierarchy in <code>exceptions.py</code>: <code>WikiError</code> base class with specific types (<code>FetchError</code>, <code>CacheError</code>, <code>SearchError</code>, <code>PageNotFoundError</code>, <code>CircuitOpenError</code>, <code>RateLimitError</code>, etc.).</p>
        <h3 style={{marginTop:24,marginBottom:12}}>Circuit Breaker</h3>
        <p style={{fontSize:14,color:'var(--text-muted)'}}>External API calls are protected by <code>circuit_breaker.py</code>: <strong>closed</strong> (normal) → <strong>open</strong> (after 5 failures, blocks calls for 300s) → <strong>half-open</strong> (test calls, 3 successes to recover). Prevents cascading failures when upstream APIs are down.</p>
      </section>

      {/* DEPENDENCIES */}
      <section id="deps">
        <h1 className="section-title">Dependencies</h1>
        <p className="section-subtitle">All required, optional, and external dependencies. Install status and availability for each component.</p>
        <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
          {["all","required","optional","external","builtin"].map(f => <div key={f} className={`tab ${depFilter===f?'active':''}`}
            style={{border:'1px solid var(--border)',borderRadius:99,padding:'4px 14px',cursor:'pointer',fontSize:12,fontWeight:500,textTransform:'capitalize'}}
            onClick={()=>setDepFilter(f)}>{f === "all" ? `All (${EXTERNAL_DEPS.length})` : f}</div>)}
        </div>
        {filteredDeps.map(d => <div key={d.name} className="dep-card">
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
            <span className="dep-name">{d.name}</span>
            <Badge color={d.type==='required'?'green':d.type==='optional'?'amber':d.type==='builtin'?'blue':'gray'}>{d.type}</Badge>
            <span style={{fontSize:11,color:'var(--text-light)'}}>{d.cat}</span>
          </div>
          <div style={{fontSize:13,color:'var(--text-muted)'}}>{d.desc}</div>
        </div>)}
      </section>

      {/* SOURCES */}
      <section style={{borderTop:'1px solid var(--border)',paddingTop:24}}>
        <h3 style={{marginBottom:12}}>Sources</h3>
        <div style={{fontSize:13,color:'var(--text-muted)',lineHeight:2}}>
          <a href="https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f" target="_blank" rel="noopener">Andrej Karpathy — LLM Wiki Gist</a><br/>
          <a href="https://code.claude.com/docs/en/plugins" target="_blank" rel="noopener">Claude Code Plugin Documentation</a><br/>
          <a href="https://modelcontextprotocol.io/specification/2025-11-25" target="_blank" rel="noopener">Model Context Protocol Specification</a><br/>
          <a href="https://github.com/open-spaced-repetition/free-spaced-repetition-scheduler" target="_blank" rel="noopener">FSRS — Free Spaced Repetition Scheduler</a><br/>
          <a href="https://www.w3.org/TR/prov-overview/" target="_blank" rel="noopener">W3C PROV — Provenance Data Model</a><br/>
          <a href="https://github.com/Oshayr/llm-wiki" target="_blank" rel="noopener">LLM-Wiki GitHub Repository</a>
        </div>
      </section>
    </main>
  </>;
}
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
